name: python

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]" 2>/dev/null || pip install -e .
      - run: pip install pytest ruff mypy
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
      - run: python -m build
