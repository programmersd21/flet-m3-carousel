name: integration

on: [push, pull_request]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
      - run: pip install -e .
      - run: pytest
      - working-directory: src/flutter/flet_m3_carousel
        run: flutter pub get
      - working-directory: src/flutter/flet_m3_carousel
        run: flutter analyze
      - working-directory: src/flutter/flet_m3_carousel
        run: flutter test
